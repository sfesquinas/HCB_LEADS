<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HCB · Panel de Call Center y Leads</title>
<style>
/* =========================================================
   HCB · PANEL DE CALL CENTER Y LEADS
   Prototipo funcional en HTML/CSS/JS plano (sin frameworks ni backend).
   -----------------------------------------------------------------
   AVISO PARA INFORMÁTICA (léase antes de tocar el código):
   - El login de este archivo es SIMULADO (cualquier usuario/contraseña
     no vacíos entra). Sirve para mostrar el concepto de "acceso nominal"
     -- hay que sustituirlo por el sistema de autenticación real del
     hospital y sus servidores de seguridad.
   - La persistencia usa `window.storage` (API de almacenamiento de
     Claude.ai para previsualizar artefactos). Hay que sustituirla por
     llamadas a la base de datos real (ver hoja "09 - CAMPOS BBDD LEADS"
     del Excel del protocolo para el diccionario de campos exacto).
   - La regla de negocio "las Observaciones solo se pueden AÑADIR, nunca
     editar ni borrar" SÍ está implementada a nivel de interfaz (no hay
     ningún botón de editar/borrar una línea ya guardada) pero debe
     reforzarse también en el backend/base de datos real.
   ========================================================= */

:root{
  --teal:#1F6F78;
  --teal-dark:#16515A;
  --teal-darker:#0F3438;
  --mint:#EAF5F5;
  --mint2:#DCEEF0;
  --amber:#E8A33D;
  --amber-dark:#B97F1F;
  --red:#C0392B;
  --red-bg:#FBE4E1;
  --green:#1E7A3B;
  --green-bg:#DDF3E2;
  --grey:#6B7B7E;
  --grey-bg:#F2F2F2;
  --ink:#27363A;
  --white:#FFFFFF;
  --font-head: Georgia, 'Cambria', 'Times New Roman', serif;
  --font-body: 'Segoe UI', Arial, Helvetica, sans-serif;
  --radius: 10px;
  --shadow: 0 2px 10px rgba(15,52,56,0.08);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--mint);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;}
#app{min-height:100vh;display:flex;flex-direction:column;}
h1,h2,h3{font-family:var(--font-head);color:var(--teal-dark);margin:0 0 6px 0;}
a{color:var(--teal-dark);}
button{font-family:var(--font-body);cursor:pointer;}
input,select,textarea{font-family:var(--font-body);font-size:14px;}
.container{max-width:1080px;margin:0 auto;padding:24px 20px 60px;width:100%;}
.small{font-size:12.5px;color:var(--grey);}
.muted{color:var(--grey);}
.hidden{display:none !important;}

/* ---------- top bar ---------- */
.topbar{background:var(--teal-darker);color:var(--white);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.topbar .brand{display:flex;align-items:center;gap:10px;font-family:var(--font-head);font-weight:bold;font-size:18px;}
.topbar .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--amber);}
.topbar nav{display:flex;gap:6px;flex-wrap:wrap;}
.topbar nav button{background:transparent;border:1px solid rgba(255,255,255,0.25);color:var(--mint2);padding:7px 14px;border-radius:20px;font-size:13px;}
.topbar nav button.active{background:var(--teal);color:var(--white);border-color:var(--teal);}
.topbar .session{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mint2);}
.topbar .session .lock{opacity:.85;}
.topbar .session button{background:none;border:none;color:var(--mint2);text-decoration:underline;font-size:12.5px;padding:0;}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;border:none;border-radius:8px;padding:11px 18px;font-size:14.5px;font-weight:600;transition:filter .12s;}
.btn:hover{filter:brightness(0.94);}
.btn-primary{background:var(--teal);color:var(--white);}
.btn-dark{background:var(--teal-dark);color:var(--white);}
.btn-amber{background:var(--amber);color:var(--white);}
.btn-outline{background:var(--white);color:var(--teal-dark);border:1.5px solid var(--teal);}
.btn-danger{background:var(--red);color:var(--white);}
.btn-ghost{background:transparent;color:var(--teal-dark);border:1px solid var(--mint2);}
.btn-sm{padding:7px 12px;font-size:13px;}
.btn[disabled]{opacity:.5;cursor:not-allowed;}
.btn-block{width:100%;justify-content:center;}

/* ---------- cards / layout ---------- */
.card{background:var(--white);border:1px solid var(--mint2);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);}
.card + .card{margin-top:16px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
@media (max-width:820px){ .grid-2,.grid-3{grid-template-columns:1fr;} }

.kicker{text-transform:uppercase;letter-spacing:1.5px;font-size:11.5px;color:var(--amber-dark);font-weight:700;margin-bottom:6px;}

/* ---------- form fields ---------- */
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;color:var(--grey);margin-bottom:4px;font-weight:600;}
.field input[type=text], .field input[type=tel], .field input[type=date], .field input[type=time], .field input[type=datetime-local], .field select, .field textarea{
  width:100%;padding:10px 12px;border:1px solid #C9D7D8;border-radius:8px;background:var(--mint);color:var(--ink);
}
.field textarea{resize:vertical;min-height:70px;}
.radio-group{display:flex;flex-direction:column;gap:8px;}
.radio-option{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1.5px solid var(--mint2);border-radius:8px;cursor:pointer;background:var(--white);}
.radio-option:hover{border-color:var(--teal);}
.radio-option input{margin-top:3px;}
.radio-option .opt-title{font-weight:600;color:var(--ink);}
.radio-option .opt-sub{font-size:12.5px;color:var(--grey);}

/* ---------- badges / pills ---------- */
.badge{display:inline-block;padding:4px 11px;border-radius:14px;font-size:12px;font-weight:700;color:var(--white);white-space:nowrap;}
.pill-outcome{display:inline-block;padding:8px 16px;border-radius:20px;font-weight:700;font-size:13.5px;color:var(--white);}

/* ---------- script box (guion a decir) ---------- */
.script-box{background:var(--mint);border-left:4px solid var(--teal);border-radius:6px;padding:12px 14px;margin:10px 0;font-style:italic;color:var(--ink);}
.script-label{font-style:normal;font-weight:700;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--teal-dark);display:block;margin-bottom:4px;}
.aviso-box{background:var(--red-bg);border-left:4px solid var(--red);border-radius:6px;padding:12px 14px;margin:10px 0;color:#7A241C;font-size:13.5px;}
.aviso-box b{color:var(--red);}
.dev-tag{display:inline-block;background:var(--amber);color:white;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:10px;margin-left:8px;vertical-align:middle;}

/* ---------- table (leads panel) ---------- */
table.leads{width:100%;border-collapse:collapse;background:var(--white);border-radius:var(--radius);overflow:hidden;}
table.leads th{background:var(--teal-dark);color:var(--white);text-align:left;padding:10px 12px;font-size:12.5px;}
table.leads td{padding:10px 12px;border-bottom:1px solid var(--mint2);font-size:13.5px;}
table.leads tr:hover{background:var(--mint);cursor:pointer;}
.kpi-card{background:var(--mint);border-radius:var(--radius);padding:16px;text-align:center;}
.kpi-card .num{font-family:var(--font-head);font-size:32px;font-weight:700;color:var(--teal);}
.kpi-card .lbl{font-size:11.5px;color:var(--teal-dark);font-weight:700;text-transform:uppercase;letter-spacing:.5px;}

/* ---------- observaciones log ---------- */
.log-list{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto;padding-right:4px;}
.log-entry{background:#F7FAFA;border:1px solid #E4E9E9;border-radius:8px;padding:10px 12px;}
.log-entry .meta{font-size:11.5px;font-weight:700;color:var(--teal-dark);}
.log-entry .txt{font-size:13.5px;color:var(--ink);margin-top:2px;}
.add-comment-row{display:flex;gap:8px;margin-top:10px;}
.add-comment-row textarea{flex:1;}
.lock-note{font-size:11.5px;color:var(--grey);font-style:italic;margin-top:6px;}

/* ---------- modal ---------- */
.modal-backdrop{position:fixed;inset:0;background:rgba(15,52,56,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
.modal{background:var(--white);border-radius:var(--radius);max-width:560px;width:100%;max-height:85vh;overflow-y:auto;padding:22px;}
.modal h3{margin-bottom:10px;}
.modal-close-row{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
.wa-text{background:var(--mint);border-radius:8px;padding:14px;font-size:13.5px;white-space:pre-wrap;margin:10px 0;}

/* ---------- objeciones floating button ---------- */
.fab-objeciones{position:fixed;bottom:22px;right:22px;background:var(--teal-dark);color:var(--white);border:none;border-radius:24px;padding:12px 18px;box-shadow:0 4px 14px rgba(0,0,0,.25);font-weight:700;font-size:13px;z-index:40;}

/* ---------- login ---------- */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--teal-darker),var(--teal-dark));}
.login-card{background:var(--white);border-radius:14px;padding:36px 34px;width:380px;max-width:92vw;box-shadow:0 10px 40px rgba(0,0,0,.3);}
.login-card .logo{font-family:var(--font-head);font-weight:700;font-size:22px;color:var(--teal-dark);margin-bottom:2px;}
.login-card .logo-sub{font-size:12px;color:var(--grey);margin-bottom:22px;}
.login-note{font-size:11.5px;color:var(--grey);margin-top:14px;border-top:1px dashed var(--mint2);padding-top:10px;}

/* ---------- wizard progress ---------- */
.steps-bar{display:flex;gap:6px;margin-bottom:18px;}
.steps-bar .seg{flex:1;height:5px;border-radius:3px;background:var(--mint2);}
.steps-bar .seg.done{background:var(--teal);}

/* ---------- footer ---------- */
.footer-note{margin-top:40px;padding-top:16px;border-top:1px solid var(--mint2);font-size:11.5px;color:var(--grey);}
</style>
</head>

/* ---------- validación de formato ---------- */
function validateEmailFormat(v){
  if(!v) return true; // opcional
  return /^[^\s@]+@[^\s@]+\.[A-Za-z]{2,}$/.test(v.trim());
}
const DNI_LETRAS = "TRWAGMYFPDXBNJZSQVHLCKE";
function dniNieTieneFormatoEspanol(v){
  const s = (v||"").toUpperCase().replace(/[\s-]/g,"");
  return /^\d{8}[A-Z]$/.test(s) || /^[XYZ]\d{7}[A-Z]$/.test(s);
}
function validateDniNieFormat(v){
  if(!v) return true; // opcional
  const s = v.toUpperCase().replace(/[\s-]/g,"");
  let m = s.match(/^(\d{8})([A-Z])$/);
  if(m) return DNI_LETRAS[parseInt(m[1],10) % 23] === m[2];
  m = s.match(/^([XYZ])(\d{7})([A-Z])$/);
  if(m){ const map={X:"0",Y:"1",Z:"2"}; return DNI_LETRAS[parseInt(map[m[1]]+m[2],10) % 23] === m[3]; }
  return true; // no tiene forma de DNI/NIE español -> se admite como otro documento (pasaporte, etc.)
}
function validatePhoneParts(prefijo, numero){
  const n = (numero||"").replace(/[\s-]/g,"");
  if(!prefijo || !/^\+\d{1,4}$/.test(prefijo)) return false;
  return /^\d{6,12}$/.test(n);
}

/* ---------- persistencia (window.storage con respaldo a localStorage) ----------
   Cambiar SOLO estas 4 funciones cuando Informática conecte
   la base de datos real; el resto de la app no debe tocarse.
   Si window.storage no existe (p. ej. la app publicada fuera de
   Claude.ai, como en GitHub Pages), se usa localStorage del
   navegador como respaldo — solo para que la demo funcione;
   en producción real esto lo sustituye la BBDD del hospital. */
const HAS_CLAUDE_STORAGE = (typeof window.storage !== "undefined");
async function storageSet(key, valueObj){
  try{
    if(HAS_CLAUDE_STORAGE){ await window.storage.set(key, JSON.stringify(valueObj), false); }
    else { localStorage.setItem(key, JSON.stringify(valueObj)); }
    return true;
  } catch(e){ console.error("storageSet error", e); return false; }
}
async function storageGet(key){
  try{
    if(HAS_CLAUDE_STORAGE){ const r = await window.storage.get(key, false); return r ? JSON.parse(r.value) : null; }
    const v = localStorage.getItem(key);
    return v ? JSON.parse(v) : null;
  } catch(e){ return null; }
}
async function storageListKeys(prefix){
  try{
    if(HAS_CLAUDE_STORAGE){ const r = await window.storage.list(prefix, false); return (r && r.keys) ? r.keys : []; }
    const keys = [];
    for(let i=0;i<localStorage.length;i++){ const k = localStorage.key(i); if(k && k.startsWith(prefix)) keys.push(k); }
    return keys;
  } catch(e){ return []; }
}


async function loadAllLeads(){
  const keys = await storageListKeys("lead:");
  const leads = [];
  for(const k of keys){
    const v = await storageGet(k);
    if(v) leads.push(v);
  }
  leads.sort((a,b)=> new Date(b.fecha_hora_entrada) - new Date(a.fecha_hora_entrada));
  APP.leads = leads;
  return leads;
}
async function saveLead(lead){ await storageSet("lead:"+lead.id_lead, lead); }

function computeTieneSeguroLabel(w){
  if(w.motivoTipo === "asistencial") return w.pacienteEncontrado ? "Sí (paciente ya registrado)" : (w.seguro==="tiene" ? "Sí" : "No");
  if(w.motivoTipo === "plan"){

  if(w.motivoTipo === "harmony") return "No aplica (Harmony es privado)";

/* ------------------------------------------------------------
   Exportación a Excel (.csv, se abre directamente en Excel) —
   estructura mínima de referencia: Año, Trimestre, Fecha, Nombre,
   Teléfono, Email (tomada del ejemplo de exportación de leads
   histórico), con Categoría/Estado/Centro/Unidad/Canal/Agente
   añadidos como columnas — en el ejemplo original esos datos iban
   como filtro fijo del informe (una exportación por Estado+Centro);
   aquí van por fila para poder exportar varios a la vez, y respeta
   los filtros de Categoría y Estado activos en el panel.
   Se genera en CSV (sin librerías externas: nada que Informática
   tenga que servir desde un CDN ni que la red del hospital pueda
   bloquear) — Excel y LibreOffice lo abren igual que un .xlsx.
   ------------------------------------------------------------ */
function trimestreDe(fecha){
  const mes = fecha.getMonth()+1; // 1-12
  return "Trim." + Math.ceil(mes/3);
}
function csvEscape(val){
  const s = String(val==null ? "" : val);
  if(/[",\n;]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}
function exportLeadsToExcel(){
  const leads = APP.leads.filter(l =>
    (LEADS_FILTER==="TODOS" || l.estado===LEADS_FILTER) &&
    (CATEGORIA_FILTER==="TODAS" || l.categoria===CATEGORIA_FILTER)
  );
  if(leads.length===0){ alert("No hay leads que exportar con este filtro."); return; }
  const headers = ["Año","Trimestre","Fecha","Nombre","Teléfono","Email","Categoría","Estado","Centro","Unidad / Programa","Canal","Agente"];
  const rows = leads.map(l=>{
    const f = new Date(l.fecha_hora_entrada);
    return [
      f.getFullYear(), trimestreDe(f), f.toLocaleDateString("es-ES"),
      l.nombre_apellidos || "", l.telefono || "", l.email || "(en blanco)",
      l.categoria || "Sin clasificar", l.estado || "", l.centro || "", l.unidad_plan_interes || "", l.canal || "", l.agente_asignado || "",
    ];
  });
  const lines = [headers, ...rows].map(r => r.map(csvEscape).join(";"));
  const csv = "\uFEFF" + lines.join("\r\n"); // BOM para que Excel respete tildes/ñ
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const hoy = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `HCB_Leads_${hoy}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

      <div class="field">
        <label><input type="checkbox" ${lead.no_contactar?"checked disabled":""} onchange="markNoContactar(this.checked)"/> No volver a contactar (irreversible desde esta pantalla)</label>
      </div>

      <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-amber btn-sm" ${lead.no_contactar?"disabled":""} onclick="showWaModal('WA-01')">Ver WA-01 Bienvenida</button>
        <button class="btn btn-amber btn-sm" ${lead.no_contactar?"disabled":""} onclick="showWaModal('WA-03')">Ver WA-03 Cumpleaños</button>
      </div>
    </div>

    <div class="card">
      <div class="kicker">Observaciones — histórico, no editable</div>
      <p class="small muted">Solo se puede añadir. Ninguna línea existente se puede editar ni borrar.</p>
      <div class="log-list">${logs}</div>
      <div class="add-comment-row">
        <textarea id="new-comment" rows="2" placeholder="Añadir comentario…"></textarea>
        <button class="btn btn-primary" onclick="submitComment()">Enviar</button>
      </div>
    </div>
  </div>`;
}

async function updateLeadField(field, value){
  const lead = getCurrentLead(); if(!lead) return;
  lead[field] = value;
  await saveLead(lead);
}
async function updateLeadEstado(nuevoEstado){
  const lead = getCurrentLead(); if(!lead) return;
  const anterior = lead.estado;
  lead.estado = nuevoEstado;
  await addObservacion(lead, `Cambio de estado: "${anterior}" → "${nuevoEstado}".`);
  const waCode = ESTADO_A_WA[nuevoEstado];
  await loadAllLeads();
  render();
  if(waCode) showWaModal(waCode);
}
async function markNoContactar(checked){
  if(!checked) return;
  if(!confirm("Esta acción es irreversible desde esta pantalla. ¿Confirmas marcar NO VOLVER A CONTACTAR?")) { render(); return; }
  const lead = getCurrentLead(); if(!lead) return;
  lead.no_contactar = true;
  await addObservacion(lead, "Marcado NO VOLVER A CONTACTAR a petición del paciente.");
  await loadAllLeads();
  render();
}
async function submitComment(){
  const txt = el("new-comment").value.trim();
  if(!txt) return;
  const lead = getCurrentLead(); if(!lead) return;
  await addObservacion(lead, txt);
  await loadAllLeads();
  render();
}

/* ============================================================
   8) MODALES: plantillas de WhatsApp y objeciones generales
   ============================================================ */
function showWaModal(code){ APP.modal = {type:"wa", code}; render(); }
function showObjecionesModal(){ APP.modal = {type:"objeciones"}; render(); }
function closeModal(){ APP.modal = null; render(); }

async function marcarWaEnviado(code){
  const lead = getCurrentLead();
  if(lead){ await addObservacion(lead, `Plantilla ${code} (${WA_TEMPLATES[code].nombre}) enviada.`); await loadAllLeads(); }
  closeModal();
}

function renderModal(){
  if(!APP.modal) return "";
  if(APP.modal.type === "objeciones"){
    const rows = OBJECIONES.map(o=>`<div class="log-entry"><div class="meta">${escapeHtml(o.obj)}</div><div class="txt">${escapeHtml(o.resp)}</div></div>`).join("");
    return `<div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
      <div class="modal"><h3>Objeciones generales</h3><div class="log-list" style="max-height:60vh;">${rows}</div>
      <div class="modal-close-row"><button class="btn btn-outline" onclick="closeModal()">Cerrar</button></div></div></div>`;
  }
  if(APP.modal.type === "wa"){
    const t = WA_TEMPLATES[APP.modal.code];
    const lead = getCurrentLead();
    const vars = lead ? {nombre:lead.nombre_apellidos, plan:lead.unidad_plan_interes, enlace:"https://harmony.hcb.es/reserva", fecha:fmtDateTime(lead.proxima_accion_fecha), centro:"HCB"} : {nombre:"{{nombre}}", plan:"{{plan}}", enlace:"{{enlace}}", fecha:"{{fecha}}", centro:"{{centro}}"};
    const texto = fillTemplate(t.texto, vars);
    return `<div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <h3>${APP.modal.code} · ${escapeHtml(t.nombre)}</h3>
        <div class="wa-text">${escapeHtml(texto)}</div>
        <div class="modal-close-row">
          <button class="btn btn-ghost" onclick="closeModal()">Cerrar</button>
          ${lead ? `<button class="btn btn-primary" onclick="marcarWaEnviado('${APP.modal.code}')">Marcar como enviado</button>` : ""}
        </div>
      </div></div>`;
  }
  return "";
}

/* ============================================================
   9) ARRANQUE
   ============================================================ */
render();
</script>
</body>
</html>
